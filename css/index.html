
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Poker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">♠ ROYAL <span>POKER</span></div>
    <div class="balance-box">
        🪙 <span id="balance">5000</span>
    </div>
</header>

<main>
    <div class="heading">
        <h1>ROYAL POKER</h1>
        <p>TEXAS HOLD'EM</p>
    </div>

    <section class="table">

        <div class="opponent">
            <div class="avatar">🤖</div>
            <h3>BOT PLAYER</h3>
            <p>🪙 <span id="botBalance">5000</span></p>
            <div class="cards" id="botCards"></div>
            <div id="botStatus" class="status">Очікує</div>
        </div>

        <div class="center">
            <div class="pot-title">ЗАГАЛЬНИЙ БАНК</div>
            <div class="pot">🪙 <span id="pot">0</span></div>
            <div class="cards community" id="community"></div>
            <div id="roundName" class="round-name">Очікування гри</div>
        </div>

        <div class="player">
            <div class="cards" id="playerCards"></div>
            <div class="avatar">😎</div>
            <h3>YOU</h3>
            <p>🪙 <span id="playerBalance">5000</span></p>
            <div id="playerStatus" class="status">Готовий</div>
        </div>

    </section>

    <section class="panel">
        <h2>♣ ТВОЯ СТАВКА ♣</h2>

        <div id="message" class="message">
            Натисни «Нова гра», щоб почати!
        </div>

        <div class="bet-info">
            <div>
                <span>МІНІМУМ</span>
                <strong>100 🪙</strong>
            </div>
            <div>
                <span>ПОТОЧНИЙ БАНК</span>
                <strong id="potInfo">0 🪙</strong>
            </div>
            <div>
                <span>СТАВКА ДЛЯ CALL</span>
                <strong id="callAmount">0 🪙</strong>
            </div>
        </div>

        <label for="betAmount">СУМА СТАВКИ</label>
        <input type="number" id="betAmount" min="100"
               step="100" value="500">

        <div class="buttons">
            <button id="foldBtn" class="fold" disabled>FOLD</button>
            <button id="callBtn" class="call" disabled>CALL</button>
            <button id="raiseBtn" class="raise" disabled>RAISE ↑</button>
        </div>

        <button id="newGameBtn" class="new-game">
            ♠ НОВА ГРА
        </button>
    </section>
</main>

<footer>ROYAL POKER © 2026</footer>

<script src="script.js"></script>
</body>
</html>
